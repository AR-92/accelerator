<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toast Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Shadcn/ui inspired styles */
      :root {
        --background: 0 0% 100%;
        --foreground: 222.2 84% 4.9%;
        --muted: 210 40% 96%;
        --muted-foreground: 215.4 16.3% 46.9%;
        --border: 214.3 31.8% 91.4%;
        --ring: 222.2 84% 4.9%;
      }

      .dark {
        --background: 222.2 84% 4.9%;
        --foreground: 210 40% 98%;
        --muted: 217.2 32.6% 17.5%;
        --muted-foreground: 215 20.2% 65.1%;
        --border: 217.2 32.6% 17.5%;
        --ring: 212.7 26.8% 83.9%;
      }

      body {
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
      }

      .animate-in {
        animation: animate-in 0.3s ease-out;
      }

      .slide-in-from-right-2 {
        animation: slide-in-from-right-2 0.3s ease-out;
      }

      .fade-in {
        animation: fade-in 0.3s ease-out;
      }

      .animate-out {
        animation: animate-out 0.3s ease-in;
      }

      .slide-out-to-right-2 {
        animation: slide-out-to-right-2 0.3s ease-in;
      }

      .fade-out {
        animation: fade-out 0.3s ease-in;
      }

      @keyframes animate-in {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes slide-in-from-right-2 {
        from {
          transform: translateX(100%);
        }
        to {
          transform: translateX(0);
        }
      }

      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes animate-out {
        from {
          opacity: 1;
          transform: scale(1);
        }
        to {
          opacity: 0;
          transform: scale(0.95);
        }
      }

      @keyframes slide-out-to-right-2 {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(100%);
        }
      }

      @keyframes fade-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body class="p-8">
    <h1 class="text-2xl font-bold mb-8">Beautiful Toast Notifications</h1>

    <div class="space-x-4 space-y-4">
      <button
        onclick="showSuccessToast('Success!', 'Your action was completed successfully.')"
        class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors"
      >
        Show Success Toast
      </button>

      <button
        onclick="showErrorToast('Error!', 'Something went wrong. Please try again.')"
        class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors"
      >
        Show Error Toast
      </button>

      <button
        onclick="showWarningToast('Warning!', 'Please review your input before proceeding.')"
        class="px-4 py-2 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700 transition-colors"
      >
        Show Warning Toast
      </button>

      <button
        onclick="showInfoToast('Info!', 'Here is some useful information for you.')"
        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
      >
        Show Info Toast
      </button>

      <button
        onclick="showToast('Custom message with default styling', 'info')"
        class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors"
      >
        Show Simple Toast
      </button>
    </div>

    <script src="/js/toast.js"></script>
  </body>
</html>
